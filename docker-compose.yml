services:
  postgres:
    image: postgres:16-alpine
    container_name: airquality_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airquality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airquality_secret}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality_santiago}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - air_quality_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airquality} -d ${POSTGRES_DB:-air_quality_santiago}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: airquality_etl
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - air_quality_net
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: airquality_api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      etl:
        condition: service_completed_successfully
    networks:
      - air_quality_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: airquality_dashboard
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8050
    ports:
      - "${DASHBOARD_PORT:-8050}:8050"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - air_quality_net

networks:
  air_quality_net:
    driver: bridge

volumes:
  pg_data:
